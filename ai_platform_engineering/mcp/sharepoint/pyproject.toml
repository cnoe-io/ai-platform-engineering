[project]
name = "mcp-sharepoint"
version = "0.1.0"
description = "Read-only SharePoint MCP server backed by Microsoft Graph"
license = "Apache-2.0"
authors = [{ name = "CNOE Contributors" }]
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "click==8.3.1",
  "fastmcp==3.3.1",
  "httpx==0.28.1",
  "mcp==1.28.1",
  "mcp-agent-auth", # gitleaks:allow - package name, not a credential
  "pydantic==2.12.5",
  "python-dotenv==1.2.2",
]

[dependency-groups]
dev = [
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.1",
]

[tool.uv]
package = false
constraint-dependencies = ["uv==0.11.18"]

[tool.uv.sources]
mcp-agent-auth = { path = "../common/mcp-auth", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 140
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
