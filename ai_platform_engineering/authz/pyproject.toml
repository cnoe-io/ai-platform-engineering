[project]
name = "caipe-authz"
version = "0.1.0"
description = "Canonical CAIPE authorization service"
requires-python = ">=3.13,<4.0"
dependencies = [
  "cryptography==49.0.0",
  "fastapi==0.135.3",
  "grpcio==1.78.0",
  "httpx==0.28.1",
  "prometheus-client==0.23.1",
  "protobuf==5.29.6",
  "pydantic==2.12.5",
  "pyjwt==2.13.0",
  "pymongo==4.15.5",
  "uvicorn==0.41.0",
]

[dependency-groups]
dev = [
  "mongomock==4.3.0",
  "pytest==9.0.3",
  "pytest-asyncio==1.3.0",
  "pytest-cov==7.1.0",
  "ruff==0.14.8",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E", "F", "I"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
