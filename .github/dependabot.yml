---
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # The organization Actions policy allowlists the immutable v4.0.1 SHA.
    # Newer pins cause GitHub to reject every referencing workflow at startup.
    ignore:
      - dependency-name: "dorny/paths-filter"
    groups:
      # Grouping minor and patch updates for GitHub Actions
      github-actions-minor-patch:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
