name: "[Release] Agentic App Runtime Release"
description: "Tag and build an agentic-app-runtime release from the current branch HEAD (main or a release/* branch)."

# Usage:
#   GitHub UI → Actions → "[Release] Agentic App Runtime Release" → Run workflow (choose branch: main or release/*)
#   gh workflow run release-agentic-apps.yml --ref main
#
# What this does:
#   1. Reads the nearest semver release tag to determine X.Y.Z.
#   2. Computes the short SHA of HEAD and a branch tag ("main" or "release").
#   3. Derives version: X.Y.Z-apps-<branch-tag>-<sha>
#   4. Bumps ui/package.json to that version.
#   5. Commits to the branch and creates annotated git tag agentic-apps-X.Y.Z-apps-<branch-tag>-<sha>.
#   6. Dispatches ci-agentic-app-runtime.yml with tag_version=X.Y.Z-apps-<branch-tag>-<sha>.
#   7. Creates a draft GitHub release.

on:
  workflow_dispatch: {}
  workflow_call: {}

permissions:
  contents: write
  actions: write

jobs:
  release:
    name: Tag and dispatch build
    runs-on: ubuntu-latest

    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - name: 📥 Checkout branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏷️ Derive version and SHA
        id: ver
        run: |
          set -euo pipefail

          BASE=$(grep '^version = ' pyproject.toml | sed 's/version = "\(.*\)"/\1/' | grep -oE '^[0-9]+\.[0-9]+\.[0-9]+' || true)
          if [[ -z "$BASE" ]]; then
            echo "❌ Could not read version from pyproject.toml."
            exit 1
          fi

          REF_NAME="${{ github.ref_name }}"
          if [[ "$REF_NAME" == "main" ]]; then
            BRANCH_TAG="main"
          elif [[ "$REF_NAME" == release/* ]]; then
            BRANCH_TAG="release"
          else
            echo "❌ Releases can only be cut from 'main' or a 'release/*' branch (got '$REF_NAME')"
            exit 1
          fi

          SHORT=$(git rev-parse --short HEAD)
          VERSION="${BASE}-apps-${BRANCH_TAG}-${SHORT}"
          GIT_TAG="agentic-apps-${VERSION}"

          echo "base=$BASE"             >> "$GITHUB_OUTPUT"
          echo "branch_tag=$BRANCH_TAG" >> "$GITHUB_OUTPUT"
          echo "short=$SHORT"           >> "$GITHUB_OUTPUT"
          echo "version=$VERSION"       >> "$GITHUB_OUTPUT"
          echo "git_tag=$GIT_TAG"       >> "$GITHUB_OUTPUT"
          echo "✅ base=$BASE  branch_tag=$BRANCH_TAG  sha=$SHORT  version=$VERSION"

      - name: 🔍 Check tag doesn't already exist
        run: |
          set -euo pipefail
          GIT_TAG="${{ steps.ver.outputs.git_tag }}"
          if git ls-remote --exit-code --tags origin "refs/tags/$GIT_TAG" >/dev/null 2>&1; then
            echo "❌ Tag '$GIT_TAG' already exists"
            exit 1
          fi
          echo "✅ Tag '$GIT_TAG' is available"

      - name: 📤 Tag and push
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          GIT_TAG="${{ steps.ver.outputs.git_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "$GIT_TAG" -m "Agentic app runtime release $VERSION"
          git push origin "$GIT_TAG"
          echo "✅ Pushed tag: $GIT_TAG"

      - name: 🚀 Dispatch ci-agentic-app-runtime.yml
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.ver.outputs.version }}"
          echo "📦 Dispatching ci-agentic-app-runtime.yml with tag_version=$VERSION"
          gh workflow run ci-agentic-app-runtime.yml \
            --repo "${{ github.repository }}" \
            --ref "${{ github.ref_name }}" \
            -f tag_version="$VERSION"
          echo "✅ Dispatch sent"

      - name: 📋 Create draft GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          GIT_TAG="${{ steps.ver.outputs.git_tag }}"
          VERSION="${{ steps.ver.outputs.version }}"
          gh release create "$GIT_TAG" \
            --repo "${{ github.repository }}" \
            --title "Agentic App Runtime $VERSION" \
            --generate-notes \
            --draft
          echo "✅ Draft release created: $GIT_TAG"

      - name: 📊 Summary
        run: |
          VERSION="${{ steps.ver.outputs.version }}"
          GIT_TAG="${{ steps.ver.outputs.git_tag }}"
          cat >> "$GITHUB_STEP_SUMMARY" << EOF
          ## Agentic App Runtime Release

          | Item | Value |
          |------|-------|
          | Base release | \`${{ steps.ver.outputs.base }}\` |
          | Branch | \`${{ github.ref_name }}\` (\`${{ steps.ver.outputs.branch_tag }}\`) |
          | Short SHA | \`${{ steps.ver.outputs.short }}\` |
          | Version | \`$VERSION\` |
          | Git tag | \`$GIT_TAG\` |

          - Image: \`ghcr.io/${{ github.repository_owner }}/caipe-agentic-app-runtime:$VERSION\`
          - Draft release: https://github.com/${{ github.repository }}/releases/tag/$GIT_TAG
          EOF
