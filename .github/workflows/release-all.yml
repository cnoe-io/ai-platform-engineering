name: "[Release] Release All Mirror Apps"
description: "Tag and build caipe-ui, agentic-app-runtime, and tome-agent from main HEAD in parallel."

# Usage:
#   GitHub UI → Actions → "[Release] Release All Mirror Apps" → Run workflow
#   gh workflow run release-all.yml
#
# Triggers release-caipe-ui, release-agentic-apps, and release-tome in parallel.
# Each derives X.Y.Z from the nearest semver tag on main and appends its own
# suffix + short SHA. All three image builds run concurrently.

on:
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  release-caipe-ui:
    name: Release caipe-ui
    uses: ./.github/workflows/release-caipe-ui.yml
    permissions:
      contents: write
      actions: write

  release-agentic-apps:
    name: Release agentic-app-runtime
    uses: ./.github/workflows/release-agentic-apps.yml
    permissions:
      contents: write
      actions: write

  release-tome:
    name: Release tome-agent
    uses: ./.github/workflows/release-tome.yml
    permissions:
      contents: write
      actions: write
