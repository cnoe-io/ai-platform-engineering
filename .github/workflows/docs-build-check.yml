# Validate Docusaurus build on every PR that touches docs/
name: "[Check] Docs Build"

on:
  pull_request:
    paths:
      - "docs/**"
      - "scripts/npm/**"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Docusaurus site
    runs-on: ubuntu-latest
    steps:
      - name: 🔒 harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25  # v2.22.1
        with:
          egress-policy: audit
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v6
        with:
          node-version: "lts/*"
      - name: Install helm-docs
        env:
          HELM_DOCS_VERSION: "1.14.2"
        run: |
          curl -sSL "https://github.com/norwoodj/helm-docs/releases/download/v${HELM_DOCS_VERSION}/helm-docs_${HELM_DOCS_VERSION}_Linux_x86_64.tar.gz" \
            | tar -xz helm-docs
          sudo mv helm-docs /usr/local/bin/helm-docs
      - name: Generate Helm chart docs
        run: make helm-docs
      - name: Install dependencies
        run: |
          cd docs
          npm install
      - name: Test npm security backports
        working-directory: docs
        run: node --test ../scripts/npm/*.test.mjs
      - name: Build Docusaurus site
        env:
          NODE_OPTIONS: "--max-old-space-size=8192"
        run: |
          cd docs
          npm run build
