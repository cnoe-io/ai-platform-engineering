name: "[CI] OpenFGA Authz Bridge Build and Push"
# Build, test, and publish the OpenFGA ext_authz bridge image.

on:
  push:
    tags:
      - '**'
  pull_request:
    paths:
      - 'deploy/openfga/bridge/**'
      - 'deploy/openfga/model.fga'
      - 'charts/ai-platform-engineering/charts/openfga/authorization-model.json'
      - 'charts/ai-platform-engineering/charts/openfga-authz-bridge/**'
      - '.github/workflows/ci-openfga-authz-bridge.yml'
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'Version tag to apply (e.g., 0.5.0-rc.7)'
        required: false
        type: string

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0

      - name: Validate authored OpenFGA model
        run: >-
          docker run --rm
          -v "$PWD:/repo:ro"
          openfga/cli@sha256:26acde96d90420e53fe361a740dcceba4b67f1c49e4f35117cd0c19c83ac5068
          model validate --file /repo/deploy/openfga/model.fga

      - name: Run bridge unit and real OpenFGA E2E tests
        env:
          RUN_OPENFGA_E2E: "1"
        run: >-
          uv run --project deploy/openfga/bridge pytest
          deploy/openfga/bridge/tests/test_grpc_bridge.py
          deploy/openfga/bridge/tests/test_conditions_e2e.py
          deploy/openfga/bridge/tests/test_helm_values.py::test_helm_openfga_model_includes_tool_expression_condition
          deploy/openfga/bridge/tests/test_helm_values.py::test_bridge_subchart_renders_tool_policy_context_env
          deploy/openfga/bridge/tests/test_helm_values.py::test_bridge_subchart_rejects_incomplete_tool_policy_configuration

  determine-changes:
    runs-on: ubuntu-latest
    outputs:
      should_build: ${{ steps.set-outputs.outputs.should_build }}
      tag_version: ${{ steps.version.outputs.tag_version }}
      image_prefix: ${{ steps.set-outputs.outputs.image_prefix }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          fetch-depth: 0

      - name: Determine Tag
        id: version
        uses: ./.github/actions/determine-release-tag
        with:
          manual_tag: ${{ inputs.tag_version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set Outputs
        id: set-outputs
        env:
          TAG_VERSION: ${{ steps.version.outputs.tag_version }}
        run: |
          SHOULD_BUILD="true"

          if [[ "$TAG_VERSION" =~ -chart\.[0-9]+$ ]]; then
            SHOULD_BUILD="false"
            IMAGE_PREFIX=""
          elif [[ "$TAG_VERSION" =~ -(rc|hotfix)\.[0-9]+ ]]; then
            IMAGE_PREFIX="pre-release/"
          else
            IMAGE_PREFIX=""
          fi

          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "image_prefix=$IMAGE_PREFIX" >> "$GITHUB_OUTPUT"

  # Build natively per-platform (no QEMU) and push by digest only;
  # merge-manifests combines the per-arch digests into the final tagged
  # multi-arch manifest list. See ci-rag.yml for the incident this pattern
  # was introduced to fix (QEMU-emulated arm64 timing out/OOMing).
  build-and-push:
    runs-on: ${{ matrix.runner }}
    needs: [test, determine-changes]
    if: |
      needs.determine-changes.outputs.should_build == 'true' &&
      (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'prebuild/'))
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/${{ needs.determine-changes.outputs.image_prefix }}openfga-authz-bridge
      DOCKERFILE: deploy/openfga/bridge/Dockerfile
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-hotfix.') && !contains(github.ref_name, '-chart.')) }}
            type=raw,value=${{ needs.determine-changes.outputs.tag_version }},enable=${{ needs.determine-changes.outputs.tag_version != '' }}
            type=ref,event=tag,prefix=
            type=sha,format=short,prefix=

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: deploy/openfga/bridge
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Export digest
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Combine the per-arch digests into a single tagged multi-arch manifest list.
  merge-manifests:
    runs-on: ubuntu-latest
    needs: [determine-changes, build-and-push]
    if: |
      needs.determine-changes.outputs.should_build == 'true' &&
      (github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/'))
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository_owner }}/${{ needs.determine-changes.outputs.image_prefix }}openfga-authz-bridge
    steps:
      - name: 🔒 Harden runner
        uses: step-security/harden-runner@b09bb98e06d4d774595224525879c09bc6e98c40  # v2.20.1
        with:
          egress-policy: audit

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ github.event_name == 'workflow_dispatch' || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-hotfix.') && !contains(github.ref_name, '-chart.')) }}
            type=raw,value=${{ needs.determine-changes.outputs.tag_version }},enable=${{ needs.determine-changes.outputs.tag_version != '' }}
            type=ref,event=tag,prefix=
            type=sha,format=short,prefix=

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          mapfile -t METADATA_TAGS < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          TAG_ARGS=()
          for tag in "${METADATA_TAGS[@]}"; do
            TAG_ARGS+=("-t" "$tag")
          done

          DIGEST_ARGS=()
          for digest in *; do
            DIGEST_ARGS+=("${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@sha256:$digest")
          done

          docker buildx imagetools create "${TAG_ARGS[@]}" "${DIGEST_ARGS[@]}"

      - name: Inspect image
        run: |
          docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}

  notify-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs: [determine-changes, build-and-push, merge-manifests]
    if: |
      always() &&
      needs.determine-changes.outputs.tag_version != '' &&
      !contains(needs.determine-changes.outputs.tag_version, '-')
    steps:
      - name: 🔔 Notify release finalize
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG_VERSION: ${{ needs.determine-changes.outputs.tag_version }}
          WORKFLOW_NAME: ${{ github.workflow }}
        run: |
          CONCLUSION="${{ needs.build-and-push.result }}"
          if [[ "$CONCLUSION" == "skipped" ]]; then CONCLUSION="success"; fi
          MERGE_CONCLUSION="${{ needs.merge-manifests.result }}"
          if [[ "$MERGE_CONCLUSION" == "skipped" ]]; then MERGE_CONCLUSION="success"; fi
          if [[ "$MERGE_CONCLUSION" != "success" ]]; then CONCLUSION="failure"; fi

          gh api /repos/${{ github.repository }}/dispatches --input - <<EOF
          {
            "event_type": "ci-completed",
            "client_payload": {
              "tag": "$TAG_VERSION",
              "workflow": "$WORKFLOW_NAME",
              "conclusion": "$CONCLUSION"
            }
          }
          EOF
