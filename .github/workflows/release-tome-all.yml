name: "[Release] Tome All Mirror Apps"
description: "Tag and build caipe-ui, agentic-app-runtime, and tome-agent from the current branch HEAD (main or a release/* branch) in parallel."

# Usage:
#   GitHub UI → Actions → "[Release] Tome All Mirror Apps" → Run workflow (choose branch: main or release/*)
#   gh workflow run release-tome-all.yml --ref main
#
# Triggers release-caipe-ui, release-agentic-apps, and release-tome in parallel.
# Each derives X.Y.Z from the nearest semver tag, and appends its own suffix +
# a "main"/"release" branch tag + short SHA. All three image builds run
# concurrently. Run from main for mainline builds, or from a release/*
# branch (e.g. release/tome-mvp) to publish images tagged with "release"
# instead of "main".

on:
  workflow_dispatch: {}

permissions:
  actions: write
  contents: read

jobs:
  release-caipe-ui:
    name: Release caipe-ui
    uses: ./.github/workflows/release-caipe-ui.yml
    permissions:
      contents: write
      actions: write

  release-agentic-apps:
    name: Release agentic-app-runtime
    uses: ./.github/workflows/release-agentic-apps.yml
    permissions:
      contents: write
      actions: write

  release-tome:
    name: Release tome-agent
    uses: ./.github/workflows/release-tome.yml
    permissions:
      contents: write
      actions: write
