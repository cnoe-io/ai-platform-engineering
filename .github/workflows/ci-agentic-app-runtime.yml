name: "[CI] Agentic App Runtime Build and Push"

on:
  push:
    tags:
      - "agentic-apps-*"
  pull_request:
    paths:
      - "ui/apps/**"
      - "ui/package.json"
      - "ui/package-lock.json"
      - "build/Dockerfile.agentic-app"
      - ".github/workflows/ci-agentic-app-runtime.yml"
  workflow_dispatch:
    inputs:
      tag_version:
        description: "Version tag to apply (e.g., 0.6.0-dev.1)"
        required: false
        type: string
      source_sha:
        description: "Exact source commit to build (used by coordinated Tome builds)"
        required: false
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/caipe-agentic-app-runtime
  DOCKERFILE: build/Dockerfile.agentic-app
  LOCAL_IMAGE: caipe-agentic-app-runtime:ci

jobs:
  contract-test:
    name: Browser client and static example contracts
    runs-on: ubuntu-latest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install locked UI dependencies
        run: npm ci --prefix ui --ignore-scripts

      - name: Test browser client, runtime paths, and static examples
        run: node --test ui/apps/_lib/*.test.mjs ui/apps/agentic-apps/weather/*.test.mjs

  smoke-test:
    name: Smoke test ${{ matrix.app }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: finops
            port: 3010
            command: node apps/agentic-apps/finops/server.mjs
            portEnv: FINOPS_APP_PORT
            jwtDisabledEnv: AGENTIC_APP_FINOPS_JWT_DISABLED
            pagePath: /
          - app: weather
            port: 3020
            command: node apps/agentic-apps/weather/server.mjs
            portEnv: WEATHER_APP_PORT
            jwtDisabledEnv: AGENTIC_APP_WEATHER_JWT_DISABLED
            pagePath: /
          - app: agentic-sdlc
            port: 3030
            command: node apps/agentic-sdlc/server.mjs
            portEnv: AGENTIC_SDLC_APP_PORT
            jwtDisabledEnv: AGENTIC_APP_AGENTIC_SDLC_JWT_DISABLED
            pagePath: /
          - app: oss-repo-management
            port: 3040
            command: node apps/agentic-apps/oss-repo-management/server.mjs
            portEnv: OSS_REPO_MANAGEMENT_APP_PORT
            jwtDisabledEnv: AGENTIC_APP_OSS_REPO_MANAGEMENT_JWT_DISABLED
            pagePath: /
          - app: jira-project-dashboard
            port: 3041
            command: node apps/agentic-apps/jira-project-dashboard/server.mjs
            portEnv: JIRA_PROJECT_DASHBOARD_APP_PORT
            jwtDisabledEnv: AGENTIC_APP_JIRA_PROJECT_DASHBOARD_JWT_DISABLED
            pagePath: /
          - app: litellm
            port: 3042
            command: node apps/agentic-apps/litellm/server.mjs
            portEnv: LITELLM_APP_PORT
            jwtDisabledEnv: AGENTIC_APP_LITELLM_JWT_DISABLED
            pagePath: /
          - app: speakers-collective
            port: 3043
            command: node apps/agentic-apps/speakers-collective/server.mjs
            portEnv: SPEAKERS_COLLECTIVE_APP_PORT
            jwtDisabledEnv: AGENTIC_APP_SPEAKERS_COLLECTIVE_JWT_DISABLED
            pagePath: /

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Build local agentic app runtime image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          load: true
          tags: ${{ env.LOCAL_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=min
          provenance: false
          sbom: false

      - name: Start ${{ matrix.app }} server
        shell: bash
        env:
          APP: ${{ matrix.app }}
          COMMAND: ${{ matrix.command }}
          PORT: ${{ matrix.port }}
          PORT_ENV: ${{ matrix.portEnv }}
          JWT_DISABLED_ENV: ${{ matrix.jwtDisabledEnv }}
        run: |
          set -euo pipefail
          docker run -d \
            --name "agentic-app-${APP}" \
            -p "127.0.0.1:${PORT}:${PORT}" \
            -e NODE_ENV=test \
            -e "${PORT_ENV}=${PORT}" \
            -e "${JWT_DISABLED_ENV}=true" \
            "${LOCAL_IMAGE}" \
            sh -c "${COMMAND}"

      - name: Check ${{ matrix.app }} /healthz
        shell: bash
        env:
          APP: ${{ matrix.app }}
          PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail
          for _ in {1..30}; do
            if curl --fail --silent --show-error "http://127.0.0.1:${PORT}/healthz"; then
              echo
              echo "${APP} health check passed"
              exit 0
            fi
            sleep 2
          done
          echo "${APP} health check failed"
          docker logs "agentic-app-${APP}" || true
          exit 1

      - name: Check ${{ matrix.app }} browser contract
        shell: bash
        env:
          APP: ${{ matrix.app }}
          PAGE_PATH: ${{ matrix.pagePath }}
          PORT: ${{ matrix.port }}
        run: |
          set -euo pipefail
          PAGE_HTML=$(curl --fail --silent --show-error "http://127.0.0.1:${PORT}${PAGE_PATH}")
          case "$APP" in
            finops|weather|oss-repo-management|litellm)
              grep --fixed-strings --quiet "createAgenticAppConversation" <<< "$PAGE_HTML"
              EXAMPLE_HTML=$(curl --fail --silent --show-error "http://127.0.0.1:${PORT}/example")
              grep --fixed-strings --quiet "STATIC EXAMPLE · SAMPLE DATA · NO LIVE CONNECTION" <<< "$EXAMPLE_HTML"
              ;;
            speakers-collective)
              grep --fixed-strings --quiet "caipe.agenticApp.context.v1" <<< "$PAGE_HTML"
              EXAMPLE_HTML=$(curl --fail --silent --show-error "http://127.0.0.1:${PORT}/example")
              grep --fixed-strings --quiet "STATIC EXAMPLE · SAMPLE DATA · NO LIVE CONNECTION" <<< "$EXAMPLE_HTML"
              ;;
            *)
              grep --fixed-strings --quiet "createAgenticAppConversation" <<< "$PAGE_HTML"
              ;;
          esac

      - name: Stop ${{ matrix.app }} server
        if: always()
        shell: bash
        env:
          APP: ${{ matrix.app }}
        run: docker rm -f "agentic-app-${APP}" || true

  # Build each architecture natively. QEMU can leave ARM64 npm processes hung
  # after an illegal instruction instead of returning a failure to BuildKit.
  build-and-push:
    name: Build runtime image (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs: [contract-test, smoke-test]
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
            arch: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            arch: arm64

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v6
        with:
          ref: ${{ inputs.source_sha || github.sha }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'workflow_dispatch' && inputs.source_sha == '') || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-hotfix.') && !contains(github.ref_name, '-chart.')) }}
            type=raw,value=${{ inputs.tag_version }},enable=${{ inputs.tag_version != '' }}
            type=ref,event=tag,prefix=
            type=sha,format=short,prefix=,enable=${{ inputs.source_sha == '' }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7
        with:
          context: .
          file: ${{ env.DOCKERFILE }}
          platforms: ${{ matrix.platform }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.revision=${{ inputs.source_sha || github.sha }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=agentic-runtime-${{ matrix.arch }}
          cache-to: type=gha,mode=min,scope=agentic-runtime-${{ matrix.arch }}
          provenance: false
          sbom: false

      - name: Export digest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: agentic-runtime-digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge-manifests:
    name: Publish runtime image
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/')
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - name: Download digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: agentic-runtime-digests-*
          path: /tmp/digests
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable=${{ (github.event_name == 'workflow_dispatch' && inputs.source_sha == '') || (startsWith(github.ref, 'refs/tags/') && !contains(github.ref_name, '-rc.') && !contains(github.ref_name, '-hotfix.') && !contains(github.ref_name, '-chart.')) }}
            type=raw,value=${{ inputs.tag_version }},enable=${{ inputs.tag_version != '' }}
            type=ref,event=tag,prefix=
            type=sha,format=short,prefix=,enable=${{ inputs.source_sha == '' }}

      - name: Create manifest list and push
        shell: bash
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          mapfile -t tags < <(jq -r '.tags[]' <<< "$DOCKER_METADATA_OUTPUT_JSON")
          command=(docker buildx imagetools create)
          for tag in "${tags[@]}"; do
            command+=(-t "$tag")
          done
          for digest in *; do
            command+=("${REGISTRY}/${IMAGE_NAME}@sha256:${digest}")
          done
          "${command[@]}"

      - name: Inspect image
        run: docker buildx imagetools inspect ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.version }}
