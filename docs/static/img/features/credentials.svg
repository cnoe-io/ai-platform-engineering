<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="560" viewBox="0 0 1040 560" role="img" aria-labelledby="title description">
  <title id="title">Credentials feature preview</title>
  <desc id="description">Privacy-safe illustration of connected applications and protected secrets.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#18c6b4"/>
      <stop offset="1" stop-color="#8b5cf6"/>
    </linearGradient>
  </defs>
  <rect width="1040" height="560" rx="24" fill="#090c14"/>
  <rect x="36" y="34" width="968" height="492" rx="18" fill="#101522" stroke="#293247"/>
  <text x="70" y="88" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="28" font-weight="700">Credentials</text>
  <text x="70" y="119" fill="#93a4bd" font-family="Inter,Arial,sans-serif" font-size="16">Connect approved applications and manage protected secrets.</text>
  <rect x="70" y="154" width="900" height="92" rx="14" fill="#0c111c" stroke="#263148"/>
  <circle cx="116" cy="200" r="21" fill="url(#accent)"/>
  <path d="M108 199h16M116 191v16" stroke="#fff" stroke-width="3" stroke-linecap="round"/>
  <text x="154" y="194" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Connected applications</text>
  <text x="154" y="220" fill="#93a4bd" font-family="Inter,Arial,sans-serif" font-size="14">OAuth health, refresh status, and provider permissions</text>
  <rect x="70" y="266" width="900" height="92" rx="14" fill="#0c111c" stroke="#263148"/>
  <circle cx="116" cy="312" r="21" fill="#1b2435" stroke="#18c6b4"/>
  <path d="M109 312a7 7 0 1 1 14 0v9h-14zm3-1v-4a4 4 0 0 1 8 0v4" fill="none" stroke="#18c6b4" stroke-width="2"/>
  <text x="154" y="306" fill="#f8fafc" font-family="Inter,Arial,sans-serif" font-size="18" font-weight="600">Saved secrets</text>
  <text x="154" y="332" fill="#93a4bd" font-family="Inter,Arial,sans-serif" font-size="14">Encrypted values remain hidden after creation</text>
  <rect x="70" y="393" width="900" height="82" rx="12" fill="#111827" stroke="#334155" stroke-dasharray="7 7"/>
  <text x="520" y="426" text-anchor="middle" fill="#cbd5e1" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="600">Privacy-safe documentation preview</text>
  <text x="520" y="450" text-anchor="middle" fill="#7f8da3" font-family="Inter,Arial,sans-serif" font-size="13">Account names, tokens, and provider metadata are intentionally omitted.</text>
</svg>
